<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 분양·거래시장 지도</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #legend {
      position: absolute; bottom: 24px; left: 12px;
      background: rgba(255,255,255,0.92); border: 1px solid #dde3ed;
      border-radius: 8px; padding: 10px 14px;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12px; color: #333;
      z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;              /* 색상 오버레이가 실제로 떴을 때만 보여 준다 */
    }
    #legend h4 { font-size: 11px; color: #666; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .legend-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Malgun Gothic', sans-serif; font-size: 14px; color: #666;
      z-index: 2000;
    }
  </style>
  <!--
    V-World 로더.

    domain 파라미터가 실제 Referer와 일치해야 인증이 통과하므로 URL을 통째로
    고정할 수 없다. 그렇다고 appendChild로 동적 주입하면, 로더가 의존 스크립트를
    document.write로 뱉는데 "동적 삽입된 스크립트에서의 document.write"는
    브라우저가 무시해 버린다.

    그래서 파싱 시점에 실행되는 인라인 스크립트에서 document.write로 태그를
    써낸다. 파서가 정상 경로로 처리하므로 정적 <script>와 동일하게 동기·순서
    보장 로드되고, 로더가 부르는 중첩 document.write도 네이티브로 동작한다.
    별도의 shim이 필요 없다.
  -->
  <script>
    (function () {
      // hostname이 아니라 host(포트 포함)를 쓴다. V-World는 domain 파라미터뿐 아니라
      // 브라우저가 보내는 Referer 오리진까지 등록 도메인과 정확히 비교하는데,
      // 비표준 포트에서는 Referer에 포트가 붙는다(http://localhost:9090). 따라서
      // domain도 포트를 포함해야 하고, V-World 쪽 등록 도메인에도 포트가 있어야 한다.
      // (등록값에 포트가 없으면 어느 쪽을 보내도 INCORRECT_KEY다 — 직접 확인)
      var domain = window.location.protocol + '//' + window.location.host;
      var url = 'https://map.vworld.kr/js/vworldMapInit.js.do'
              + '?version=2.0'
              + '&apiKey=' + '__VWORLD_API_KEY__'
              + '&domain=' + domain;
      document.write('<scr' + 'ipt src="' + url + '"><\/scr' + 'ipt>');
    })();
  </script>
</head>
<body>
  <div id="loading">지도 로딩 중...</div>
  <div id="map"></div>
  <div id="legend">
    <div id="legend-unsold">
      <h4>미분양 현황</h4>
      <div class="legend-item"><div class="legend-color" style="background:#1a6b3c"></div> 미분양 없음</div>
      <div class="legend-item"><div class="legend-color" style="background:#4caf82"></div> 50세대 미만</div>
      <div class="legend-item"><div class="legend-color" style="background:#f5c842"></div> 50~150세대</div>
      <div class="legend-item"><div class="legend-color" style="background:#e8845a"></div> 150~300세대</div>
      <div class="legend-item"><div class="legend-color" style="background:#e05c5c"></div> 300세대 이상</div>
    </div>
    <!-- 실거래가 모드 — 절대 가격 구간이 아니라 "현재 선택된 지역 내" 5분위
         상대 순위다(부산·경남 등 지역 간 절대 가격차가 커서 고정 구간은
         특정 지역이 항상 빨강/초록으로 고정돼 정보성이 없다). -->
    <div id="legend-price" style="display:none">
      <h4>실거래가 (선택 지역 내 상대순위)</h4>
      <div class="legend-item"><div class="legend-color" style="background:#1a6b3c"></div> 하위 20%</div>
      <div class="legend-item"><div class="legend-color" style="background:#4caf82"></div> 중하위 20%</div>
      <div class="legend-item"><div class="legend-color" style="background:#f5c842"></div> 중위 20%</div>
      <div class="legend-item"><div class="legend-color" style="background:#e8845a"></div> 중상위 20%</div>
      <div class="legend-item"><div class="legend-color" style="background:#e05c5c"></div> 상위 20%</div>
    </div>
  </div>

  <script>
    /* ==================================================================
       외부 GeoJSON(github vuski/admdongkor) 의존을 걷어내고 행정구역을
       V-World 자체 소스로만 그린다. 두 갈래를 함께 쓴다.

         (A) WMS 행정구역 레이어  — api.vworld.kr/req/wms, lt_c_adsigg /
             lt_c_ademd. 타일 이미지라서 CORS와 무관하게 무조건 뜬다.
             경계선·라벨의 "보이는 밑그림"을 담당한다. 이건 여전히 V-World를
             브라우저에서 직접 호출한다(캐싱 대상 아님).
         (B) 지오메트리 캐시       — /geometry/sigg, /geometry/emd
             (dashboards/app.py). LT_C_ADSIGG_INFO / LT_C_ADEMD_INFO GeoJSON을
             서버가 V-World에서 받아 파일로 캐싱해 둔 것을 그대로 내려준다.
             ol.layer.Vector로 올려 ① 구별 미분양 색칠 ② 동 단위 클릭 판정을
             담당한다.

       왜 (B)가 필요한가: WMS는 래스터다. forEachFeatureAtPixel은 벡터
       피처만 돌려주므로 WMS 레이어에서는 영원히 아무것도 잡히지 않는다.
       클릭으로 구·동 이름을 얻으려면 실제 지오메트리(B)를 갖고 있거나
       GetFeatureInfo를 왕복해야 한다.

       그래서 폴백을 3단으로 둔다.
         1) 지오메트리 캐시 성공   → 벡터 클릭 + 색상 오버레이 + 범례
         2) 지오메트리 캐시 실패   → WMS GetFeatureInfo로 이름만 얻어 클릭 유지,
                                     색상 오버레이·범례는 포기(범례 숨김)
         3) 둘 다 실패             → 지도만 표시, 클릭 무반응(콘솔에 경고)

       (B)는 같은 origin(/geometry/...)에서 오므로 CORS·JSONP 폴백이 필요 없다
       — V-World 데이터 API를 직접 호출하던 예전 버전에는 있었지만, 지금은
       서버(app.py)가 그 호출과 페이지네이션·90일 캐싱을 대신 처리한다.
       ================================================================== */

    var VWORLD_KEY = '__VWORLD_API_KEY__';

    var WMS_API  = 'https://api.vworld.kr/req/wms';

    // WMS 레이어명은 소문자다 (데이터 API 쪽 대문자 _INFO 레이어명은 이제
    // /geometry 캐시 라우트(app.py)가 알고 있으므로 여기선 필요 없다).
    var WMS_LAYERS   = 'lt_c_adsigg,lt_c_ademd';
    var WMS_DONG     = 'lt_c_ademd';
    var DATA_SIGG    = 'LT_C_ADSIGG_INFO';   // addWMSBoundaryLayer 레이어명 인자로만 쓰인다

    // 최초 카메라 위치(부산 중심). 지오메트리가 아직 로드되지 않은 시점이라
    // bbox 기반 이동을 쓸 수 없어 고정값이 필요하다 — 로드가 끝나면 Dash 쪽
    // 지역 선택 바(region-select/district-select)가 move_to_region 메시지로
    // 원하는 시·군·구의 실제 bbox로 이동시킬 수 있다.
    var INIT_LON  = 129.0756;
    var INIT_LAT  = 35.1796;
    var INIT_ZOOM = 11;

    // 시도 코드 → 지역명. isInRegion() 필터 기준이자, 미분양 색칠 키
    // ("지역_구군")와 클릭 브리지에 실어 보내는 region 값의 출처이기도 하다.
    var SIDO_TO_REGION = { '26': '부산', '31': '울산', '48': '경남' };

    // 데이터 API(구·군/읍면동 GeoJSON) 호출·페이지네이션·BOX 필터는 더 이상
    // 여기서 하지 않는다 — dashboards/app.py의 /geometry/<type> 라우트가 V-World를
    // 대신 불러 파일로 캐싱해 두고, 여기서는 그 캐시를 fetch만 한다(fetchGeometry
    // 참고). 그래도 걸려 들어온 다른 시도는 여전히 isInRegion()에서 코드로 걷어낸다.

    /* ---------------- 상태 ---------------- */
    var unsoldData  = {};
    var priceData   = {};       // 'region_구군' → 평균거래가(만원), 실거래가 색상 모드용
    var colorMode   = 'unsold'; // 'unsold' | 'price' — Dash map-color-mode RadioItems가 결정
    var priceBreakpoints = null;       // 현재 캐시된 5분위 경계값 [p20,p40,p60,p80]
    var priceBreakpointsRegion = null; // 위 캐시가 어느 region 기준으로 계산됐는지
    var map;                   // vw.ol3.Map
    var olMap;                 // ol.Map (map 자체이거나 map.map)
    var wmsSource   = null;
    var guLayer     = null;    // 구·군 색상 폴리곤
    var dongSource  = null;    // 동 단위 클릭 판정용
    var dongLayer   = null;
    var guNameByCode = {};     // '26110' → '중구'
    var regionFeaturesByName = {};  // '부산_중구' → 시·군·구 ol.Feature (moveToRegion 이동용)
    var wmsInfoWarned = false;

    // 현재 지역 선택 바(Dash)에서 고른 값. move_to_region 메시지를 받을 때마다
    // 갱신되고, guFillStyle이 이 값을 읽어 선택된 지역/구·군만 색칠한다.
    // 초기값은 Dash 쪽 selected-region-store의 초기값(부산, 구·군 미선택)과 맞춘다.
    var currentSelection = { region: '부산', district: null };

    // 지도에서 마지막으로 클릭한 읍면동(동) ("지역_구군_동" 키 — 구·군 간
    // 동명 동이 있을 수 있어 region·gu까지 포함해야 한다). dongHitStyle이 이
    // 키와 일치하는 동 feature의 테두리만 강조하고, 새로 클릭하면 이전 강조는
    // (키가 더 이상 일치하지 않으므로) 자연히 사라진다 — feature.setStyle을
    // 직접 건드려 이전 참조를 들고 있을 필요가 없다. 구·군 단위로만 히트되거나
    // (동 정보 없음) WMS 폴백으로 해석된 클릭은 강조를 켜지 않고 null로 비운다
    // (resolveByVector/resolveByWms 참고) — 구·군 레이어(guLayer)의 미분양
    // 색칠(fill)과는 무관하다.
    var highlightedDongKey = null;

    // Dash 쪽에서 준비 여부를 들여다볼 수 있게 열어 둔다.
    window.vworldReady = false;

    function setLoading(msg) {
      var el = document.getElementById('loading');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }

    function showLegend(on) {
      var el = document.getElementById('legend');
      if (el) el.style.display = on ? 'block' : 'none';
    }

    // colorMode에 맞는 범례 세트만 보이게 전환한다 (showLegend는 전체 #legend
    // 박스의 노출 여부만 담당 — 이 함수는 그 안의 두 세트 중 하나를 고른다).
    function setLegendMode(mode) {
      var unsoldEl = document.getElementById('legend-unsold');
      var priceEl  = document.getElementById('legend-price');
      if (unsoldEl) unsoldEl.style.display = (mode === 'price') ? 'none' : 'block';
      if (priceEl)  priceEl.style.display  = (mode === 'price') ? 'block' : 'none';
    }

    function currentDomain() {
      // 포트를 포함해야 한다 — 상단 로더의 host/Referer 주석 참고.
      return window.location.protocol + '//' + window.location.host;
    }

    function getColor(unsoldCount) {
      if (!unsoldCount || unsoldCount === 0) return '#1a6b3c';
      if (unsoldCount < 50)  return '#4caf82';
      if (unsoldCount < 150) return '#f5c842';
      if (unsoldCount < 300) return '#e8845a';
      return '#e05c5c';
    }

    // 실거래가는 지역 간 절대 가격 스케일 차이가 커서(부산 해운대구 vs 경남
    // 소도시 등) 고정 구간을 쓰면 특정 지역이 늘 한 색으로 고정돼 정보성이
    // 없다 — 그래서 "현재 선택된 지역(region) 내" 5분위(상대 순위)로 칠한다.
    // priceData 안에서 region이 일치하는 값들만 모아 20/40/60/80 백분위
    // 경계값을 계산해 캐시해 둔다(region이 바뀌거나 priceData가 갱신될 때만
    // 다시 계산 — guFillStyle이 feature마다 부르므로 매번 정렬하면 낭비).
    function computePriceBreakpoints(region) {
      var values = [];
      for (var key in priceData) {
        if (key.indexOf(region + '_') === 0) values.push(priceData[key]);
      }
      values.sort(function (a, b) { return a - b; });
      if (!values.length) {
        priceBreakpoints = null;
        priceBreakpointsRegion = region;
        return;
      }
      function pct(p) {
        // floor(n*p)를 쓰면 p=0.8에서 n이 작을 때 breakpoint가 최댓값 자체가
        // 돼 버려(예: n=5→idx=4=마지막) 아래 getPriceColor의 "<=" 비교상
        // 최댓값이 항상 4번째 버킷에 걸리고 5번째(상위 20%, 빨강)가 영원히
        // 도달 불가능해진다 — ceil(n*p)-1로 한 칸 당겨 최댓값이 실제로
        // breakpoint보다 커지도록 한다.
        var idx = Math.min(values.length - 1, Math.max(0, Math.ceil(values.length * p) - 1));
        return values[idx];
      }
      priceBreakpoints = [pct(0.2), pct(0.4), pct(0.6), pct(0.8)];
      priceBreakpointsRegion = region;
    }

    function getPriceColor(avgPrice, region) {
      if (avgPrice === undefined || avgPrice === null) return null;  // 데이터 없음
      // 방어적 폴백: region이 바뀌었을 때뿐 아니라, 어떤 경로로든
      // priceBreakpoints 자체가 비어 있으면(캐시가 "이 region은 계산
      // 끝났다"고 잘못 기억하고 있는 경우 포함) 그 자리에서 즉시 다시
      // 계산한다 — "한 번도 성공적으로 계산된 적 없는 채로 여기 도달"하는
      // 경로를 원천적으로 남기지 않는다.
      if (priceBreakpointsRegion !== region || !priceBreakpoints) {
        computePriceBreakpoints(region);
      }
      if (!priceBreakpoints) return null;
      var bp = priceBreakpoints;
      if (avgPrice <= bp[0]) return '#1a6b3c';
      if (avgPrice <= bp[1]) return '#4caf82';
      if (avgPrice <= bp[2]) return '#f5c842';
      if (avgPrice <= bp[3]) return '#e8845a';
      return '#e05c5c';
    }

    /* ==================================================================
       지도 기동
       ================================================================== */

    function initMap() {
      try {
        // V-World 2D API의 시그니처는 new vw.ol3.Map(targetDivId, mapOptions).
        // 인자가 두 개다 — 객체 하나만 넘기면 그 객체가 targetDivId 자리로 가고
        // mapOptions가 undefined가 되어 "Cannot set properties of undefined
        // (setting 'renderer')"로 죽는다.
        //
        // 초기 위치는 initPosition(CameraPosition)으로 준다. 좌표는 EPSG:3857.
        //   - initX/initY/initZoom은 이 API에 없다. 그렇게 넘기면 initPosition이
        //     빈 채로 남아 내부에서 initPosition.zoom을 읽다가
        //     "Cannot read properties of undefined (reading 'zoom')"이 난다.
        //   - vw.ol3.MapOptions는 이 빌드에서 생성자가 아니므로 plain object로 넘긴다
        //     ("is not a constructor"). CameraPosition도 같은 이유로 리터럴을 쓴다.
        var mapOptions = {
          basemapType:        vw.ol3.BasemapType.GRAPHIC,
          controlsDensity:    vw.ol3.DensityType.EMPTY,
          interactionDensity: vw.ol3.DensityType.BASIC,
          controlsAutoArrange: true,
          initPosition: {
            center: ol.proj.transform([INIT_LON, INIT_LAT], 'EPSG:4326', 'EPSG:3857'),
            zoom:   INIT_ZOOM,
          },
        };

        map = new vw.ol3.Map('map', mapOptions);

        // vw.ol3.Map은 ol.Map을 상속하므로 보통 map 자체가 ol.Map이다.
        // 빌드에 따라 map.map에 감싸 두는 경우가 있어 둘 다 받아 준다.
        olMap = (typeof map.addLayer === 'function') ? map
              : (map.map && typeof map.map.addLayer === 'function') ? map.map
              : null;
        if (!olMap) {
          throw new Error('ol.Map을 찾을 수 없습니다 (typeof map.map = ' + typeof map.map + ')');
        }

        hideLoading();
        window.vworldReady = true;

        addBoundaryLayer();     // (A) WMS 행정구역 — 실패해도 아래로 계속 간다
        bindClick();            // 클릭 핸들러는 레이어 로딩과 무관하게 미리 걸어 둔다
        loadAdminVectors();     // (B) 데이터 API — 비동기
      } catch (e) {
        var missing = missingDeps();
        setLoading('지도 초기화 실패: ' + e.message
                   + (missing.length ? ' (누락: ' + missing.join(', ') + ')' : ''));
        console.error('initMap error:', e, '| missing deps:', missing);
      }
    }

    /* ==================================================================
       (A) V-World WMS 행정구역 레이어
       ================================================================== */

    function addBoundaryLayer() {
      // 참고: map.addWMSBoundaryLayer(...)는 V-World 2D API에 존재하지 않는다
      // (로더가 노출하는 vw.ol3.Map에도, 공개 문서에도 없음). 혹시 쓰는 빌드가
      // 있으면 그대로 쓰고, 없으면 같은 결과를 ol.source.TileWMS로 직접 만든다.
      if (typeof map.addWMSBoundaryLayer === 'function') {
        try {
          map.addWMSBoundaryLayer('busan_gu', DATA_SIGG, '2023');
          console.log('[vworld] addWMSBoundaryLayer 사용');
          return;
        } catch (e) {
          console.warn('addWMSBoundaryLayer 실패 — TileWMS로 대체합니다:', e);
        }
      }

      try {
        wmsSource = new ol.source.TileWMS({
          url: WMS_API,
          // V-World WMS는 STYLES를 생략하면 예외를 뱉는다. 레이어명과 같은 값을 준다.
          params: {
            LAYERS:      WMS_LAYERS,
            STYLES:      WMS_LAYERS,
            FORMAT:      'image/png',
            TRANSPARENT: true,
            KEY:         VWORLD_KEY,
            DOMAIN:      currentDomain(),
          },
          serverType: 'geoserver',
          // 타일을 <img>로 받게 둔다. 'anonymous'로 바꾸면 CORS 헤더가 없는
          // 응답에서 타일이 통째로 깨진다.
          crossOrigin: null,
        });

        // 색상 오버레이(반투명)가 위에 얹히므로 경계선이 가려지지 않는다.
        olMap.addLayer(new ol.layer.Tile({ source: wmsSource, opacity: 0.9 }));
        console.log('[vworld] WMS 행정구역 레이어 추가:', WMS_LAYERS);
      } catch (e) {
        console.warn('WMS 행정구역 레이어 생성 실패:', e);
        wmsSource = null;
      }
    }

    /* ==================================================================
       (B) 캐시된 지오메트리(app.py의 /geometry/<type>) → 벡터 레이어
       ================================================================== */

    function loadAdminVectors() {
      // 구·군을 먼저 받아 guNameByCode를 채워 두면 동 피처의 구 이름을
      // 코드 앞 5자리로 역참조할 수 있다. 다만 full_nm 파싱으로도 구할 수
      // 있으므로 어느 한쪽이 실패해도 나머지는 살린다.
      fetchGeometry('sigg')
        .then(function (features) {
          buildGuLayer(features);
        })
        .catch(function (e) {
          console.warn('구·군 지오메트리 로드 실패 — 색상 오버레이를 건너뜁니다:', e);
          showLegend(false);
        })
        .then(function () {
          return fetchGeometry('emd');
        })
        .then(function (features) {
          buildDongLayer(features);
        })
        .catch(function (e) {
          console.warn('읍면동 지오메트리 로드 실패 — 클릭은 WMS GetFeatureInfo로 처리합니다:', e);
        });
    }

    // /geometry/<type>(type: 'sigg' 또는 'emd')에서 featureCollection을 받아
    // 대상 지역(부산·울산·경남) 피처만 남긴다.
    //
    // 예전에는 이 파일이 V-World 데이터 API를 브라우저에서 직접 불러 페이지네이션
    // (최대 3페이지)까지 처리하고, CORS가 막히면 JSONP로 재시도했다. 이제 그 전부
    // (V-World 호출·페이지 합치기·90일 파일 캐싱)를 서버(app.py의
    // serve_geometry_cache)가 대신하므로 여기서는 같은 origin(same-origin)으로
    // 캐시 파일을 fetch 한 번만 하면 된다 — CORS도, JSONP 폴백도 필요 없다.
    function fetchGeometry(type) {
      return fetch('/geometry/' + type)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(unwrapFeatureCollection)
        .then(function (fc) {
          var read = readRegionFeatures(fc);
          if (!read.features.length) {
            throw new Error(type + ': 대상 지역 피처가 0건입니다');
          }
          console.log('[vworld] ' + type + ' 대상 지역 피처 ' + read.features.length + '건');
          return read.features;
        });
    }

    function unwrapFeatureCollection(payload) {
      var res = payload && payload.response;
      if (!res) throw new Error('예상과 다른 응답 형식');
      if (res.status && res.status !== 'OK') {
        var msg = (res.error && (res.error.text || res.error.code)) || res.status;
        throw new Error('데이터 API 오류: ' + msg);
      }
      var fc = res.result && res.result.featureCollection;
      if (!fc || !fc.features) throw new Error('featureCollection이 비어 있습니다');
      return fc;
    }

    /* --- 속성 파싱 ------------------------------------------------------ */

    // V-World 데이터셋 사이에 필드명이 통일돼 있지 않아(sig_kor_nm / emd_kor_nm /
    // 축약형) 후보를 순서대로 훑는다.
    var CODE_KEYS = ['emd_cd', 'sig_cd', 'adm_cd', 'adm_sect_c', 'code'];
    var NAME_KEYS = ['emd_kor_nm', 'sig_kor_nm', 'emd_nm', 'sig_nm', 'adm_nm', 'name'];
    var FULL_KEYS = ['full_nm', 'adm_nm', 'addr'];

    function pick(props, keys) {
      if (!props) return '';
      for (var i = 0; i < keys.length; i++) {
        var v = props[keys[i]];
        if (v !== undefined && v !== null && String(v) !== '') return String(v);
      }
      return '';
    }

    // 시·군·구(기초자치단체) 토큰인지 판정한다. '시'로 끝나는 이름은 두 종류가
    // 섞여 있다 — 시·도 이름(부산광역시·울산광역시·경상남도 등)과, 자치구가 없는
    // 일반시(진주시·통영시·김해시 등). 시·도 접미사로 끝나면 제외하고 나머지 중
    // 구/군/시로 끝나는 토큰만 인정한다.
    // (경남 18개 시·군 중 진주·통영·사천·김해·밀양·거제·양산 7개 시는 자치구가
    //  없어 '시'로 끝나는 이름 하나뿐이다 — 여기서 '시'를 인정하지 않으면 이
    //  7개가 통째로 빠진다. 유일하게 자치구가 있는 창원시는 이 함수를 거치지
    //  않는다 — V-World가 애초에 의창구/성산구/마산합포구/마산회원구/진해구
    //  5개 구 레코드로 따로 준다.)
    function isDistrictToken(token) {
      if (/(광역시|특별자치시|특별시|특별자치도|도)$/.test(token)) return false;
      return /[구군시]$/.test(token);
    }

    // full_nm은 '부산광역시 중구 보수동'처럼 전체 경로로 온다.
    // 시·군·구 토큰(…구 / …군 / …시)을 집어낸다.
    function guFromFullName(fullNm) {
      if (!fullNm) return '';
      var parts = String(fullNm).trim().split(/\s+/);
      for (var i = 0; i < parts.length; i++) {
        if (isDistrictToken(parts[i])) return parts[i];
      }
      return '';
    }

    function lastToken(s) {
      if (!s) return '';
      var parts = String(s).trim().split(/\s+/);
      return parts[parts.length - 1];
    }

    // 코드 앞 두 자리가 부산(26)·울산(31)·경남(48)이면 채택. 코드가 비면 주소 문자열로 판정한다.
    function isInRegion(code, fullNm) {
      if (code) return !!SIDO_TO_REGION[code.slice(0, 2)];
      var nm = String(fullNm || '');
      return nm.indexOf('부산') === 0 || nm.indexOf('울산') === 0 || nm.indexOf('경상남도') === 0;
    }

    // isInRegion과 같은 기준으로 실제 지역명을 뽑는다. 색칠 키("지역_구군")와
    // 클릭 브리지의 region 값 모두 여기서 나온다.
    function regionFromCode(code, fullNm) {
      if (code) return SIDO_TO_REGION[code.slice(0, 2)] || '';
      var nm = String(fullNm || '');
      if (nm.indexOf('부산') === 0) return '부산';
      if (nm.indexOf('울산') === 0) return '울산';
      if (nm.indexOf('경상남도') === 0) return '경남';
      return '';
    }

    function readRegionFeatures(fc) {
      var all = new ol.format.GeoJSON().readFeatures(fc, {
        dataProjection:    'EPSG:4326',
        featureProjection: 'EPSG:3857',
      });

      var kept = [];
      all.forEach(function (f) {
        var props  = f.getProperties();
        var code   = pick(props, CODE_KEYS);
        var fullNm = pick(props, FULL_KEYS);
        if (!isInRegion(code, fullNm)) return;

        var name = pick(props, NAME_KEYS) || lastToken(fullNm);
        var gu   = guFromFullName(fullNm)
                || (code ? guNameByCode[code.slice(0, 5)] : '')
                || (isDistrictToken(name) ? name : '');

        f.set('__code',   code);
        f.set('__gu',     gu);
        f.set('__region', regionFromCode(code, fullNm));
        // 구·군 피처는 이름 자체가 구 이름이라 동이 없다.
        f.set('__dong', (name && name !== gu) ? name : '');
        kept.push(f);
      });

      return { features: kept, rawCount: (fc.features || []).length };
    }

    /* --- 레이어 구성 ---------------------------------------------------- */

    function buildGuLayer(features) {
      var skipped = 0;
      features.forEach(function (f) {
        var code   = f.get('__code');
        var gu     = f.get('__gu');
        var region = f.get('__region');
        if (code && gu) guNameByCode[code.slice(0, 5)] = gu;
        // 부산·울산 사이에 이름이 겹치는 구가 있어(중구·남구·동구·북구) region을
        // 붙인 키로 저장한다 — 안 붙이면 둘 중 하나가 다른 하나를 덮어써 버린다.
        if (gu && region) {
          regionFeaturesByName[region + '_' + gu] = f;
        } else {
          skipped++;   // region 또는 gu를 못 구한 피처 — moveToRegion 매칭에서 빠진다
        }
      });
      // regionFeaturesByName 키가 실제로 "{region}_{gu}" 형식인지, 몇 건이나
      // 등록됐는지 여기서 확인할 수 있다 (moveToRegion의 "매칭 0건" 원인 진단용).
      console.log('[vworld] regionFeaturesByName 등록 ' + Object.keys(regionFeaturesByName).length
                 + '건 (스킵 ' + skipped + '건), 예시:', Object.keys(regionFeaturesByName).slice(0, 5));

      // 스타일을 함수로 두면 미분양 값이 바뀔 때 changed()만 부르면 되고,
      // 레이어를 다시 만들거나 setStyle을 돌 필요가 없다. guFillStyle 자체가
      // feature를 받아 currentSelection과 대조하므로 여기선 그대로 넘기기만 한다.
      guLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: features }),
        style: guFillStyle,
      });
      olMap.addLayer(guLayer);
      showLegend(true);
      console.log('[vworld] 구·군 색상 레이어 추가 (' + features.length + '개)');
    }

    function buildDongLayer(features) {
      // 구·군 레이어가 먼저 떴으면 코드 역참조로 빈 구 이름을 메운다.
      features.forEach(function (f) {
        if (!f.get('__gu')) {
          var code = f.get('__code');
          if (code) f.set('__gu', guNameByCode[code.slice(0, 5)] || '');
        }
      });

      dongSource = new ol.source.Vector({ features: features });
      dongLayer = new ol.layer.Vector({
        source: dongSource,
        style:  dongHitStyle,
      });
      olMap.addLayer(dongLayer);
      console.log('[vworld] 읍면동 클릭 레이어 추가 (' + features.length + '개)');
    }

    // 레이어 style 콜백 — feature 하나마다 호출된다. currentSelection에 해당하는
    // feature만 미분양 색상(coloredFillStyle)을 칠하고, 나머지는 무채색
    // (neutralFillStyle)으로 흐린다.
    //   - district 선택됨: "지역_구군" 키가 정확히 일치하는 feature만 선택
    //   - region만 선택됨: "지역_"로 시작하는 모든 feature가 선택
    function guFillStyle(feature) {
      var key = feature.get('__region') + '_' + feature.get('__gu');
      var isSelected = currentSelection.district
        ? key === (currentSelection.region + '_' + currentSelection.district)
        : key.indexOf(currentSelection.region + '_') === 0;

      if (!isSelected) {
        return neutralFillStyle();
      }
      if (colorMode === 'price') {
        var region = feature.get('__region');
        var color  = getPriceColor(priceData[key], region);
        // 해당 구·군에 실거래가 데이터가 없으면(color===null) 선택 밖과
        // 같은 무채색으로 — "칠할 근거가 없다"를 "미분양 없음"과 구분한다.
        return color ? coloredFillStyle(color) : neutralFillStyle();
      }
      return coloredFillStyle(getColor(unsoldData[key] || 0));
    }

    function coloredFillStyle(color) {
      return new ol.style.Style({
        fill:   new ol.style.Fill({ color: color + 'bb' }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 1.5 }),
      });
    }

    // 선택 밖의 시·군·구용 — 채움 없이 옅은 회색 윤곽선만 남긴다.
    function neutralFillStyle() {
      return new ol.style.Style({
        fill:   new ol.style.Fill({ color: 'rgba(148,163,184,0.12)' }),
        stroke: new ol.style.Stroke({ color: '#9ca3af', width: 1 }),
      });
    }

    // 클릭 강조용 테두리 — 동 레이어의 미분양 색칠과는 무관하고(동 레이어는
    // 원래 색칠을 안 한다) stroke만 그린다. ol.* 호출은 항상 함수 안에서만
    // 지연 생성한다 — 최상위(top-level)에서 즉시 실행하면 V-World 로더가
    // 아직 ol을 못 올린 시점(로드 실패 등)에 스크립트 전체가 죽는다.
    function highlightStroke() {
      return new ol.style.Stroke({ color: '#ff2323', width: 4 });
    }

    // 동 단위 클릭 판정 + 강조 겸용 스타일. feature마다 다시 평가되는 함수라야
    // 클릭된 동만 강조하고 나머지는 원래(거의 안 보이는) 히트 판정용 스타일로
    // 남는다 — 이전에는 dongHitStyle()을 한 번만 호출해 만든 정적 Style
    // 객체 하나를 레이어 전체에 고정해 썼는데, 그래서는 feature별로 다르게
    // 그릴 수 없었다.
    function dongHitStyle(feature) {
      var key = feature.get('__region') + '_' + feature.get('__gu') + '_' + feature.get('__dong');
      var highlighted = (key === highlightedDongKey);
      // 알파 0인 fill은 히트 판정 캔버스에도 안 찍혀 폴리곤 내부 클릭이 안 잡힌다.
      // 강조 여부와 무관하게 항상 눈에 안 보일 정도로만 남겨 둔다 — 강조는
      // stroke만 바꾼다.
      return new ol.style.Style({
        fill:   new ol.style.Fill({ color: 'rgba(255,255,255,0.01)' }),
        stroke: highlighted ? highlightStroke()
                             : new ol.style.Stroke({ color: 'rgba(255,255,255,0.35)', width: 0.6 }),
      });
    }

    /* ==================================================================
       클릭
       ================================================================== */

    function bindClick() {
      olMap.on('click', function (evt) {
        if (resolveByVector(evt)) return;
        resolveByWms(evt);
      });
    }

    function resolveByVector(evt) {
      var hit = null;

      olMap.forEachFeatureAtPixel(evt.pixel, function (feature, layer) {
        if (hit) return;
        // 동 레이어를 우선한다. 구 레이어만 맞았으면 동은 빈 값으로 둔다.
        if (layer === dongLayer || layer === guLayer) hit = feature;
      });

      // 히트 판정 캔버스가 반투명 fill을 놓치는 경우가 있어 지오메트리로 한 번 더 본다.
      if (!hit && dongSource) {
        var at = dongSource.getFeaturesAtCoordinate(evt.coordinate);
        if (at && at.length) hit = at[0];
      }

      if (!hit) return false;
      var gu = hit.get('__gu');
      if (!gu) return false;

      var dong   = hit.get('__dong') || '';
      var region = hit.get('__region') || '';

      // 강조 키는 히트된 feature 자신의 속성으로 직접 만든다 — dongHitStyle이
      // 렌더링 시 만드는 키와 100% 같은 문자열이 보장된다(같은 feature, 같은
      // 조합 규칙). 동을 못 얻었으면(구 경계만 걸린 예외) 특정할 동이 없으므로
      // 강조를 켜지 않는다 — 다만 사이드패널은 이 클릭으로 "구 전체 평균"으로
      // 갱신되니, 이전에 다른 동을 가리키던 강조가 남아 있으면 이제 무관해져
      // 지운다(안 지우면 엉뚱한 동에 빨간 테두리가 계속 남는다).
      highlightedDongKey = dong ? (region + '_' + gu + '_' + dong) : null;
      refreshColors();

      onDongClick(gu, dong, region);
      return true;
    }

    // 벡터 지오메트리가 없을 때의 폴백. WMS 타일에서는 피처를 못 잡으므로
    // 서버에 좌표를 물어 속성만 받아 온다 (CORS가 막히면 여기서 끝난다).
    function resolveByWms(evt) {
      if (!wmsSource || typeof wmsSource.getFeatureInfoUrl !== 'function') return;

      var view = olMap.getView();
      var url = wmsSource.getFeatureInfoUrl(
        evt.coordinate, view.getResolution(), view.getProjection(),
        { INFO_FORMAT: 'application/json', QUERY_LAYERS: WMS_DONG, FEATURE_COUNT: 5 }
      );
      if (!url) return;

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          var feats = (data && data.features) || [];
          if (!feats.length) return;
          var props  = feats[0].properties || {};
          var code   = pick(props, CODE_KEYS);
          var fullNm = pick(props, FULL_KEYS);
          var name   = pick(props, NAME_KEYS) || lastToken(fullNm);
          var gu     = guFromFullName(fullNm)
                    || (code ? guNameByCode[code.slice(0, 5)] : '')
                    || (isDistrictToken(name) ? name : '');
          if (!gu) return;

          // 이 경로는 벡터 feature가 없을 때의 폴백이라(dongLayer가 아직
          // 없거나 히트 자체를 못 잡음) 강조를 그릴 대상이 없다 — 새 강조는
          // 켜지 않는다. 다만 클릭은 여전히 사이드패널을 갱신하므로, 이전
          // 강조가 남아 있다면(이제 무관해진 다른 동을 가리킴) 지운다.
          highlightedDongKey = null;
          refreshColors();

          onDongClick(gu, (name && name !== gu) ? name : '', regionFromCode(code, fullNm));
        })
        .catch(function (e) {
          if (!wmsInfoWarned) {
            wmsInfoWarned = true;
            console.warn('GetFeatureInfo 실패 — 지도 클릭이 동작하지 않습니다:', e.message);
          }
        });
    }

    function onDongClick(guName, dongName, regionName) {
      // Dash 브리지: 부모의 dcc.Interval(gu-click-interval)이 500ms마다
      // window.__lastGuClick을 폴링해 clicked-gu-store로 옮긴다.
      // 이 페이지는 부모와 같은 origin(/vworld-map.html)에서 서빙되므로
      // 부모 전역에 직접 쓸 수 있다. 다른 origin으로 옮기면 여기서 막힌다.
      //
      // 값은 JSON 문자열이다. 브리지가 "이전 값과 같으면 무시"로 중복 갱신을
      // 걸러내는데, 객체를 그대로 넣으면 매번 다른 참조라 그 비교가 깨진다.
      //
      // region: 부산·울산 사이에 이름이 겹치는 구가 있어(중구·남구·동구·북구)
      // gu 이름만으로는 Dash 쪽에서 어느 지역인지 구분할 수 없다. 코드로 못
      // 구했으면(WMS 경로 등) "부산"으로 둔다 — 지금 실제 데이터가 있는 지역이
      // 부산뿐이라 안전한 기본값이다.
      var region = regionName || '부산';

      // 클릭 강조(highlightedDongKey)는 여기서 다루지 않는다 — resolveByVector가
      // 히트된 feature 자신의 속성으로 직접 설정/해제하고, resolveByWms는
      // 벡터 feature가 없어 강조를 켜지 않는다(각 함수 참고). 이 함수는 순수하게
      // Dash 브리지 전달만 담당한다.
      var payload = JSON.stringify({ gu: guName, dong: dongName, region: region });
      try {
        window.parent.__lastGuClick = payload;
      } catch (e) {
        console.warn('부모 window에 쓸 수 없습니다 (cross-origin?):', e);
      }

      // 향후 message 방식 리스너를 위해 postMessage도 함께 보낸다.
      window.parent.postMessage(
        { type: 'dong_click', gu: guName, dong: dongName, region: region }, '*');
    }

    /* ==================================================================
       미분양 색상 주입
       ================================================================== */

    window.addEventListener('message', function (evt) {
      if (!evt.data) return;
      if (evt.data.type === 'unsold_data') {
        unsoldData = evt.data.data || {};
        refreshColors();
      } else if (evt.data.type === 'trade_price_data') {
        priceData = evt.data.data || {};
        // 캐시 무효화: priceBreakpoints뿐 아니라 priceBreakpointsRegion도 같이
        // null로 되돌려야 한다. priceBreakpointsRegion만 남아 있으면
        // getPriceColor의 "priceBreakpointsRegion !== region" 캐시 히트 체크가
        // "이 region은 이미 계산 끝났다"고 오판해서, priceData가 비어 있던
        // (아직 안 왔던) 시점에 한 번이라도 먼저 computePriceBreakpoints가 불려
        // priceBreakpoints=null로 캐시돼 버리면 이후 진짜 데이터가 도착해도
        // 다시는 재계산되지 않는다 — 실제로 재현된 버그의 원인이었다.
        priceBreakpoints = null;
        priceBreakpointsRegion = null;
        // 지금 이 순간의 선택 지역 기준으로 즉시 재계산해 둔다 — 렌더 시점의
        // 지연 계산(getPriceColor 안의 폴백)에만 기대지 않는다.
        computePriceBreakpoints(currentSelection.region);
        refreshColors();
      } else if (evt.data.type === 'color_mode') {
        // Dash map-color-mode(RadioItems)가 보낸다. guFillStyle이 이 값으로
        // getColor/getPriceColor를 분기하므로 갱신 후 다시 칠하고, 범례도
        // 맞춰 바꾼다.
        colorMode = evt.data.mode === 'price' ? 'price' : 'unsold';
        setLegendMode(colorMode);
        if (colorMode === 'price') {
          // price 모드로 들어올 때마다 현재 선택 지역 기준으로 다시 계산한다 —
          // priceData가 이미 와 있어도, region이 바뀐 채로 색상 모드만 전환되는
          // 경우까지 대비한 방어적 재계산이다.
          computePriceBreakpoints(currentSelection.region);
        }
        refreshColors();
      } else if (evt.data.type === 'move_to_region') {
        // Dash 쪽 지역 선택 바(region-select/district-select)가 보낸다.
        // currentSelection을 먼저 갱신해야 refreshColors()가 새 선택 기준으로
        // 다시 칠한다 (guFillStyle이 이 값을 읽는다).
        currentSelection = { region: evt.data.region, district: evt.data.district || null };
        // 지역 선택 바로 다른 지역/구·군으로 이동하면 이전에 지도를 클릭해서
        // 남아 있던 강조 테두리를 지운다 — 안 지우면 예전 지역의 동이 새 지역
        // 화면에서도 계속 빨간 테두리로 남는다.
        highlightedDongKey = null;
        refreshColors();

        // district가 있으면 "지역_구군" 키로, 없으면 지역명 단독으로 moveToRegion에 넘긴다.
        var key = evt.data.district ? (evt.data.region + '_' + evt.data.district) : evt.data.region;
        moveToRegion(key);
      }
    });

    function refreshColors() {
      // guLayer(구·군 색칠)와 dongLayer(동 클릭 강조)는 서로 다른 시점에
      // 따로 로드될 수 있다(loadAdminVectors가 sigg → emd 순으로 순차 로드하고,
      // 둘 중 하나만 실패할 수도 있다) — 하나가 아직 없다고 다른 레이어의
      // changed() 호출까지 막으면 안 된다. 레이어가 없으면 다음에 실제로
      // 만들어질 때 그 시점의 최신 상태(unsoldData/highlightedDongKey)를
      // 스타일 함수가 그대로 읽으므로 여기서 값만 갱신해 두는 것으로 충분하다.
      if (guLayer) {
        guLayer.changed();
        showLegend(true);
      }
      if (dongLayer) {
        dongLayer.changed();
      }
    }

    /* ==================================================================
       지역·구·군 이동 — Dash 쪽 지역 선택 바가 postMessage(move_to_region)로
       호출한다(위 message 리스너 참고). 하드코딩된 좌표 대신 이미 로드된
       LT_C_ADSIGG_INFO 피처의 실제 bbox로 이동한다(regionFeaturesByName,
       buildGuLayer 참고). 구·군 경계·색칠 레이어는 /geometry/sigg 캐시로 이미
       전체 지역(부산·울산·경남)이 로드돼 있으므로 이동 자체는 재요청 없이
       기존 레이어 위에서 일어난다.
       ================================================================== */

    // key는 두 형태를 받는다:
    //   "부산_중구"  — regionFeaturesByName의 개별 피처로 바로 이동 (구·군 선택 시)
    //   "부산"       — 그 지역에 속한 모든 피처의 bbox를 합쳐서 이동 (구·군 미선택 시)
    // regionFeaturesByName의 키는 항상 buildGuLayer에서 "{region}_{gu}" 형식으로만
    // 채워진다 (region이나 gu가 빈 문자열이면 아예 채우지 않는다) — 아래 매칭 0건
    // 로그가 찍힌다면 이 키가 실제로 그 형식이 아니거나, geometry가 아직 로드되지
    // 않은 시점에 호출됐다는 뜻이다.
    function moveToRegion(key) {
      if (!olMap || !key) return;

      var feature = regionFeaturesByName[key];
      var extent = null;
      // district(구·군)까지 선택된 단일 피처는 더 확대돼도 괜찮지만, region 전체를
      // 합친 bbox는 부산·울산·경남처럼 넓은 지역에서 과도하게 확대되기 쉬워
      // 더 낮은 상한을 둔다.
      var fitMaxZoom = feature ? 13 : 11;

      if (feature) {
        console.log('[vworld] moveToRegion: 구·군 단일 피처로 이동 — "' + key + '"');
        extent = feature.getGeometry().getExtent();
      } else {
        var prefix = key + '_';
        var matched = Object.keys(regionFeaturesByName).filter(function (k) {
          return k.indexOf(prefix) === 0;   // k.startsWith(prefix)와 동일 (ES5 호환)
        });
        console.log('[vworld] moveToRegion: region "' + key + '" → prefix "' + prefix
                   + '" 매칭 ' + matched.length + '건 (전체 등록 피처 '
                   + Object.keys(regionFeaturesByName).length + '건)');

        if (!matched.length) {
          console.warn('[vworld] moveToRegion: "' + prefix + '"로 시작하는 '
                      + 'regionFeaturesByName 키가 없습니다 — 지오메트리가 아직 '
                      + '로드되지 않았거나(buildGuLayer 전) 키 형식이 어긋났을 수 '
                      + '있습니다. 현재 키 목록:', Object.keys(regionFeaturesByName));
          return;
        }

        matched.forEach(function (k) {
          var e = regionFeaturesByName[k].getGeometry().getExtent();
          extent = extent ? ol.extent.extend(extent, e) : e.slice();
        });
      }
      if (!extent) return;

      // fit()이 폴리곤 크기에 맞춰 줌을 알아서 잡아 주므로 부산 구(작음)와
      // 경남 시·군(큼)마다 다른 줌을 손으로 정해 줄 필요는 없다. 다만 상한
      // (maxZoom)은 필요하다 — 안 두면 아주 작은 구·군 하나로 region 전체를
      // 대표하는 극단적인 경우 등에서 과도하게 확대될 수 있다. padding은 경계선이
      // 프레임 끝에 딱 붙지 않도록 하는 여백이다.
      // size를 명시적으로 넘긴다 — 생략하면 fit()이 호출 시점의
      // olMap.getSize()를 암묵적으로 읽는데, iframe이 막 로드된 직후처럼
      // 레이아웃이 아직 안정되지 않은 시점에는 이 값이 실제 화면 크기보다
      // 작게 잡혀 필요 이상으로 깊은 줌을 계산할 수 있다.
      var mapSize = olMap.getSize();
      var view = olMap.getView();
      view.fit(extent, {
        size:     mapSize,
        padding:  [40, 40, 40, 40],
        maxZoom:  fitMaxZoom,
        duration: 500,
      });
      // duration이 있는 fit()은 비동기 애니메이션이라 호출 직후 getZoom()은
      // 아직 시작 시점 값이다 — 애니메이션이 끝난 뒤의 실제 줌을 보려면
      // moveend 1회만 듣는다 (계속 듣으면 사용자가 수동으로 줌/이동할 때도
      // 매번 찍혀 로그가 시끄러워진다).
      console.log('[vworld] moveToRegion: fit 요청 — extent=' + extent.map(function (n) { return Math.round(n); })
                 + ' (폭 ' + Math.round(ol.extent.getWidth(extent)) + 'm × 높이 '
                 + Math.round(ol.extent.getHeight(extent)) + 'm), mapSize=' + mapSize
                 + ', maxZoom=' + fitMaxZoom);
      olMap.once('moveend', function () {
        var finalZoom = view.getZoom();
        console.log('[vworld] moveToRegion: fit 완료 — 최종 zoom=' + finalZoom.toFixed(2));
        // fit()의 maxZoom 옵션이 (라이브러리 버전·extent 이상치 등 원인으로) 지켜지지
        // 않는 경우가 실측으로 확인됐다 — grep으로도 이 zoom을 재조정하는 다른
        // 리스너/코드가 vworld_map.html 안에 없음을 확인했으므로(fit() 자체가 상한을
        // 넘겨 계산), fit()을 신뢰하는 대신 여기서 직접 강제한다. 이미 상한 이내면
        // 아무 것도 하지 않아 애니메이션이 다시 튀지 않는다.
        if (finalZoom > fitMaxZoom) {
          console.warn('[vworld] moveToRegion: fit()이 maxZoom(' + fitMaxZoom
                      + ')을 넘겨 zoom=' + finalZoom.toFixed(2) + '로 끝나 강제로 되돌립니다.');
          view.setZoom(fitMaxZoom);
        }
      });
    }

    /* ------------------------------------------------------------------
       기동

       로더 자체는 <head>의 인라인 document.write가 파싱 시점에 심어 놓았다.
       그쪽은 파서가 동기·순서 보장으로 처리하므로 여기서는 로드 완료만 기다린다.
       ------------------------------------------------------------------ */

    var POLL_INTERVAL_MS  = 300;
    var POLL_MAX_ATTEMPTS = 50;          // 50 × 300ms = 최대 15초
    var INIT_DELAY_MS     = 500;         // 로더 체인이 전역 등록을 끝낼 여유

    // 생성자가 실제로 건드리는 심볼만 확인한다.
    // (ol은 여기서 검사하지 않는다 — 로더가 어떤 이름으로 노출하든
    //  vw.ol3.Map이 준비됐다면 그 내부 의존성도 함께 올라와 있다.)
    function missingDeps() {
      var missing = [];
      if (typeof vw === 'undefined' || !vw.ol3) {
        missing.push('vw.ol3');
      } else {
        if (!vw.ol3.Map) missing.push('vw.ol3.Map');
        if (!vw.ol3.BasemapType || typeof vw.ol3.BasemapType.GRAPHIC === 'undefined') {
          missing.push('vw.ol3.BasemapType');
        }
      }
      return missing;
    }

    function waitForVWorld(attempt) {
      attempt = attempt || 0;
      setTimeout(function () {
        var missing = missingDeps();
        if (!missing.length) {
          initMap();
        } else if (attempt < POLL_MAX_ATTEMPTS) {
          waitForVWorld(attempt + 1);
        } else {
          console.error('V-World 의존성 대기 시간 초과. 누락:', missing);
          setLoading('V-World API 로드 실패 — 누락: ' + missing.join(', ')
                     + ' (도메인 ' + currentDomain() + ')');
        }
      }, POLL_INTERVAL_MS);
    }

    // window load = 로더와 그 체인의 서브리소스까지 전부 끝난 시점.
    // 거기서 한 번 더 500ms 여유를 두고 폴링을 시작한다.
    window.addEventListener('load', function () {
      setTimeout(function () { waitForVWorld(0); }, INIT_DELAY_MS);
    });
  </script>
</body>
</html>
