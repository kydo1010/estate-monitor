<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 분양·거래시장 지도</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #legend {
      position: absolute; bottom: 24px; left: 12px;
      background: rgba(255,255,255,0.92); border: 1px solid #dde3ed;
      border-radius: 8px; padding: 10px 14px;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12px; color: #333;
      z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: none;              /* 색상 오버레이가 실제로 떴을 때만 보여 준다 */
    }
    #legend h4 { font-size: 11px; color: #666; margin-bottom: 6px; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .legend-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Malgun Gothic', sans-serif; font-size: 14px; color: #666;
      z-index: 2000;
    }
  </style>
  <!--
    V-World 로더.

    domain 파라미터가 실제 Referer와 일치해야 인증이 통과하므로 URL을 통째로
    고정할 수 없다. 그렇다고 appendChild로 동적 주입하면, 로더가 의존 스크립트를
    document.write로 뱉는데 "동적 삽입된 스크립트에서의 document.write"는
    브라우저가 무시해 버린다.

    그래서 파싱 시점에 실행되는 인라인 스크립트에서 document.write로 태그를
    써낸다. 파서가 정상 경로로 처리하므로 정적 <script>와 동일하게 동기·순서
    보장 로드되고, 로더가 부르는 중첩 document.write도 네이티브로 동작한다.
    별도의 shim이 필요 없다.
  -->
  <script>
    (function () {
      var domain = window.location.protocol + '//' + window.location.host;
      var url = 'https://map.vworld.kr/js/vworldMapInit.js.do'
              + '?version=2.0'
              + '&apiKey=' + '__VWORLD_API_KEY__'
              + '&domain=' + domain;
      document.write('<scr' + 'ipt src="' + url + '"><\/scr' + 'ipt>');
    })();
  </script>
</head>
<body>
  <div id="loading">지도 로딩 중...</div>
  <div id="map"></div>
  <div id="legend">
    <h4>미분양 현황</h4>
    <div class="legend-item"><div class="legend-color" style="background:#1a6b3c"></div> 미분양 없음</div>
    <div class="legend-item"><div class="legend-color" style="background:#4caf82"></div> 50세대 미만</div>
    <div class="legend-item"><div class="legend-color" style="background:#f5c842"></div> 50~150세대</div>
    <div class="legend-item"><div class="legend-color" style="background:#e8845a"></div> 150~300세대</div>
    <div class="legend-item"><div class="legend-color" style="background:#e05c5c"></div> 300세대 이상</div>
  </div>

  <script>
    /* ==================================================================
       외부 GeoJSON(github vuski/admdongkor) 의존을 걷어내고 행정구역을
       V-World 자체 소스로만 그린다. 두 갈래를 함께 쓴다.

         (A) WMS 행정구역 레이어  — api.vworld.kr/req/wms, lt_c_adsigg /
             lt_c_ademd. 타일 이미지라서 CORS와 무관하게 무조건 뜬다.
             경계선·라벨의 "보이는 밑그림"을 담당한다.
         (B) 데이터 API           — api.vworld.kr/req/data,
             LT_C_ADSIGG_INFO / LT_C_ADEMD_INFO. GeoJSON 지오메트리를 주므로
             ol.layer.Vector로 올려 ① 구별 미분양 색칠 ② 동 단위 클릭 판정을
             담당한다.

       왜 (B)가 필요한가: WMS는 래스터다. forEachFeatureAtPixel은 벡터
       피처만 돌려주므로 WMS 레이어에서는 영원히 아무것도 잡히지 않는다.
       클릭으로 구·동 이름을 얻으려면 실제 지오메트리(B)를 갖고 있거나
       GetFeatureInfo를 왕복해야 한다.

       그래서 폴백을 3단으로 둔다.
         1) 데이터 API 성공        → 벡터 클릭 + 색상 오버레이 + 범례
         2) 데이터 API 실패        → WMS GetFeatureInfo로 이름만 얻어 클릭 유지,
                                     색상 오버레이·범례는 포기(범례 숨김)
         3) 둘 다 실패             → 지도만 표시, 클릭 무반응(콘솔에 경고)

       데이터 API는 브라우저에서 CORS가 막힐 수 있다. fetch가 거부되면
       같은 요청을 JSONP(callback=)로 한 번 더 시도한다.
       ================================================================== */

    var VWORLD_KEY = '__VWORLD_API_KEY__';

    var DATA_API = 'https://api.vworld.kr/req/data';
    var WMS_API  = 'https://api.vworld.kr/req/wms';

    // WMS 레이어명은 소문자, 데이터 API는 대문자 _INFO 접미사다 (서로 다른 계열).
    var WMS_LAYERS   = 'lt_c_adsigg,lt_c_ademd';
    var WMS_DONG     = 'lt_c_ademd';
    var DATA_SIGG    = 'LT_C_ADSIGG_INFO';
    var DATA_EMD     = 'LT_C_ADEMD_INFO';

    var BUSAN_LON  = 129.0756;
    var BUSAN_LAT  = 35.1796;
    var BUSAN_ZOOM = 11;

    // 데이터 API는 전국을 주므로 부산 외곽을 넉넉히 감싸는 BOX로 1차 필터하고,
    // 걸려 들어온 김해·양산·울산은 아래 isBusan()에서 코드로 걷어낸다.
    var BUSAN_BBOX  = [128.70, 34.80, 129.40, 35.45];   // EPSG:4326
    var BUSAN_SIDO  = '26';

    var PAGE_SIZE = 1000;      // 데이터 API 1회 최대치
    var MAX_PAGES = 3;

    /* ---------------- 상태 ---------------- */
    var unsoldData  = {};
    var map;                   // vw.ol3.Map
    var olMap;                 // ol.Map (map 자체이거나 map.map)
    var wmsSource   = null;
    var guLayer     = null;    // 구·군 색상 폴리곤
    var dongSource  = null;    // 동 단위 클릭 판정용
    var dongLayer   = null;
    var guNameByCode = {};     // '26110' → '중구'
    var wmsInfoWarned = false;

    // Dash 쪽에서 준비 여부를 들여다볼 수 있게 열어 둔다.
    window.vworldReady = false;

    function setLoading(msg) {
      var el = document.getElementById('loading');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }

    function showLegend(on) {
      var el = document.getElementById('legend');
      if (el) el.style.display = on ? 'block' : 'none';
    }

    function currentDomain() {
      return window.location.protocol + '//' + window.location.host;
    }

    function getColor(unsoldCount) {
      if (!unsoldCount || unsoldCount === 0) return '#1a6b3c';
      if (unsoldCount < 50)  return '#4caf82';
      if (unsoldCount < 150) return '#f5c842';
      if (unsoldCount < 300) return '#e8845a';
      return '#e05c5c';
    }

    /* ==================================================================
       지도 기동
       ================================================================== */

    function initMap() {
      try {
        // V-World 2D API의 시그니처는 new vw.ol3.Map(targetDivId, mapOptions).
        // 인자가 두 개다 — 객체 하나만 넘기면 그 객체가 targetDivId 자리로 가고
        // mapOptions가 undefined가 되어 "Cannot set properties of undefined
        // (setting 'renderer')"로 죽는다.
        //
        // 초기 위치는 initPosition(CameraPosition)으로 준다. 좌표는 EPSG:3857.
        //   - initX/initY/initZoom은 이 API에 없다. 그렇게 넘기면 initPosition이
        //     빈 채로 남아 내부에서 initPosition.zoom을 읽다가
        //     "Cannot read properties of undefined (reading 'zoom')"이 난다.
        //   - vw.ol3.MapOptions는 이 빌드에서 생성자가 아니므로 plain object로 넘긴다
        //     ("is not a constructor"). CameraPosition도 같은 이유로 리터럴을 쓴다.
        var mapOptions = {
          basemapType:        vw.ol3.BasemapType.GRAPHIC,
          controlsDensity:    vw.ol3.DensityType.EMPTY,
          interactionDensity: vw.ol3.DensityType.BASIC,
          controlsAutoArrange: true,
          initPosition: {
            center: ol.proj.transform([BUSAN_LON, BUSAN_LAT], 'EPSG:4326', 'EPSG:3857'),
            zoom:   BUSAN_ZOOM,
          },
        };

        map = new vw.ol3.Map('map', mapOptions);

        // vw.ol3.Map은 ol.Map을 상속하므로 보통 map 자체가 ol.Map이다.
        // 빌드에 따라 map.map에 감싸 두는 경우가 있어 둘 다 받아 준다.
        olMap = (typeof map.addLayer === 'function') ? map
              : (map.map && typeof map.map.addLayer === 'function') ? map.map
              : null;
        if (!olMap) {
          throw new Error('ol.Map을 찾을 수 없습니다 (typeof map.map = ' + typeof map.map + ')');
        }

        hideLoading();
        window.vworldReady = true;

        addBoundaryLayer();     // (A) WMS 행정구역 — 실패해도 아래로 계속 간다
        bindClick();            // 클릭 핸들러는 레이어 로딩과 무관하게 미리 걸어 둔다
        loadAdminVectors();     // (B) 데이터 API — 비동기
      } catch (e) {
        var missing = missingDeps();
        setLoading('지도 초기화 실패: ' + e.message
                   + (missing.length ? ' (누락: ' + missing.join(', ') + ')' : ''));
        console.error('initMap error:', e, '| missing deps:', missing);
      }
    }

    /* ==================================================================
       (A) V-World WMS 행정구역 레이어
       ================================================================== */

    function addBoundaryLayer() {
      // 참고: map.addWMSBoundaryLayer(...)는 V-World 2D API에 존재하지 않는다
      // (로더가 노출하는 vw.ol3.Map에도, 공개 문서에도 없음). 혹시 쓰는 빌드가
      // 있으면 그대로 쓰고, 없으면 같은 결과를 ol.source.TileWMS로 직접 만든다.
      if (typeof map.addWMSBoundaryLayer === 'function') {
        try {
          map.addWMSBoundaryLayer('busan_gu', DATA_SIGG, '2023');
          console.log('[vworld] addWMSBoundaryLayer 사용');
          return;
        } catch (e) {
          console.warn('addWMSBoundaryLayer 실패 — TileWMS로 대체합니다:', e);
        }
      }

      try {
        wmsSource = new ol.source.TileWMS({
          url: WMS_API,
          // V-World WMS는 STYLES를 생략하면 예외를 뱉는다. 레이어명과 같은 값을 준다.
          params: {
            LAYERS:      WMS_LAYERS,
            STYLES:      WMS_LAYERS,
            FORMAT:      'image/png',
            TRANSPARENT: true,
            KEY:         VWORLD_KEY,
            DOMAIN:      currentDomain(),
          },
          serverType: 'geoserver',
          // 타일을 <img>로 받게 둔다. 'anonymous'로 바꾸면 CORS 헤더가 없는
          // 응답에서 타일이 통째로 깨진다.
          crossOrigin: null,
        });

        // 색상 오버레이(반투명)가 위에 얹히므로 경계선이 가려지지 않는다.
        olMap.addLayer(new ol.layer.Tile({ source: wmsSource, opacity: 0.9 }));
        console.log('[vworld] WMS 행정구역 레이어 추가:', WMS_LAYERS);
      } catch (e) {
        console.warn('WMS 행정구역 레이어 생성 실패:', e);
        wmsSource = null;
      }
    }

    /* ==================================================================
       (B) 데이터 API → 벡터 레이어
       ================================================================== */

    function loadAdminVectors() {
      // 구·군을 먼저 받아 guNameByCode를 채워 두면 동 피처의 구 이름을
      // 코드 앞 5자리로 역참조할 수 있다. 다만 full_nm 파싱으로도 구할 수
      // 있으므로 어느 한쪽이 실패해도 나머지는 살린다.
      fetchAdmin(DATA_SIGG)
        .then(function (features) {
          buildGuLayer(features);
        })
        .catch(function (e) {
          console.warn('구·군 지오메트리 로드 실패 — 색상 오버레이를 건너뜁니다:', e);
          showLegend(false);
        })
        .then(function () {
          return fetchAdmin(DATA_EMD);
        })
        .then(function (features) {
          buildDongLayer(features);
        })
        .catch(function (e) {
          console.warn('읍면동 지오메트리 로드 실패 — 클릭은 WMS GetFeatureInfo로 처리합니다:', e);
        });
    }

    // 지정한 데이터셋의 부산 피처를 전부(페이지를 넘겨가며) 모아 온다.
    function fetchAdmin(dataName) {
      var acc = [];

      function nextPage(page) {
        return requestPage(dataName, page).then(function (fc) {
          var read = readBusanFeatures(fc);
          acc = acc.concat(read.features);
          // 꽉 찬 페이지가 오면 뒤가 더 있을 수 있다.
          if (read.rawCount >= PAGE_SIZE && page < MAX_PAGES) {
            return nextPage(page + 1);
          }
          return acc;
        });
      }

      return nextPage(1).then(function (features) {
        if (!features.length) {
          throw new Error(dataName + ': 부산 피처가 0건입니다');
        }
        console.log('[vworld] ' + dataName + ' 부산 피처 ' + features.length + '건');
        return features;
      });
    }

    function requestPage(dataName, page) {
      var params = {
        service:    'data',
        request:    'GetFeature',
        version:    '2.0',
        key:        VWORLD_KEY,
        domain:     currentDomain(),
        data:       dataName,
        format:     'json',
        errorformat:'json',
        size:       PAGE_SIZE,
        page:       page,
        geometry:   'true',
        attribute:  'true',
        crs:        'EPSG:4326',
        geomFilter: 'BOX(' + BUSAN_BBOX.join(',') + ')',
      };
      return getJson(DATA_API, params).then(unwrapFeatureCollection);
    }

    function unwrapFeatureCollection(payload) {
      var res = payload && payload.response;
      if (!res) throw new Error('예상과 다른 응답 형식');
      if (res.status && res.status !== 'OK') {
        var msg = (res.error && (res.error.text || res.error.code)) || res.status;
        throw new Error('데이터 API 오류: ' + msg);
      }
      var fc = res.result && res.result.featureCollection;
      if (!fc || !fc.features) throw new Error('featureCollection이 비어 있습니다');
      return fc;
    }

    /* --- fetch(CORS) → JSONP 폴백 -------------------------------------- */

    function buildUrl(base, params) {
      var qs = Object.keys(params).map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');
      return base + '?' + qs;
    }

    function getJson(base, params) {
      return fetch(buildUrl(base, params))
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .catch(function (e) {
          // CORS 거부는 TypeError로 떨어져 상태코드조차 못 본다.
          // 스크립트 태그는 CORS를 타지 않으므로 JSONP로 한 번 더 시도한다.
          console.warn('fetch 실패 — JSONP로 재시도합니다:', e.message);
          return getJsonp(base, params);
        });
    }

    var jsonpSeq = 0;

    function getJsonp(base, params) {
      return new Promise(function (resolve, reject) {
        var cbName = '__vworldJsonp' + (++jsonpSeq);
        var script = document.createElement('script');
        var timer;

        function cleanup() {
          clearTimeout(timer);
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function (data) {
          cleanup();
          resolve(data);
        };

        // callback을 지원하지 않으면 서버가 생 JSON을 돌려주고, 그건 스크립트로
        // 실행될 수 없어 onerror 또는 타임아웃으로 떨어진다. 어느 쪽이든 reject.
        var withCb = {};
        Object.keys(params).forEach(function (k) { withCb[k] = params[k]; });
        withCb.callback = cbName;

        script.src = buildUrl(base, withCb);
        script.onerror = function () {
          cleanup();
          reject(new Error('JSONP 로드 실패'));
        };
        timer = setTimeout(function () {
          cleanup();
          reject(new Error('JSONP 응답 시간 초과'));
        }, 15000);

        document.head.appendChild(script);
      });
    }

    /* --- 속성 파싱 ------------------------------------------------------ */

    // V-World 데이터셋 사이에 필드명이 통일돼 있지 않아(sig_kor_nm / emd_kor_nm /
    // 축약형) 후보를 순서대로 훑는다.
    var CODE_KEYS = ['emd_cd', 'sig_cd', 'adm_cd', 'adm_sect_c', 'code'];
    var NAME_KEYS = ['emd_kor_nm', 'sig_kor_nm', 'emd_nm', 'sig_nm', 'adm_nm', 'name'];
    var FULL_KEYS = ['full_nm', 'adm_nm', 'addr'];

    function pick(props, keys) {
      if (!props) return '';
      for (var i = 0; i < keys.length; i++) {
        var v = props[keys[i]];
        if (v !== undefined && v !== null && String(v) !== '') return String(v);
      }
      return '';
    }

    // full_nm은 '부산광역시 중구 보수동'처럼 전체 경로로 온다.
    // 구·군 토큰(…구 / …군)을 집어낸다.
    function guFromFullName(fullNm) {
      if (!fullNm) return '';
      var parts = String(fullNm).trim().split(/\s+/);
      for (var i = 0; i < parts.length; i++) {
        if (/[구군]$/.test(parts[i])) return parts[i];
      }
      return '';
    }

    function lastToken(s) {
      if (!s) return '';
      var parts = String(s).trim().split(/\s+/);
      return parts[parts.length - 1];
    }

    // 코드 앞 두 자리가 부산(26)이면 채택. 코드가 비면 주소 문자열로 판정한다.
    function isBusan(code, fullNm) {
      if (code) return code.slice(0, 2) === BUSAN_SIDO;
      return String(fullNm || '').indexOf('부산') === 0;
    }

    function readBusanFeatures(fc) {
      var all = new ol.format.GeoJSON().readFeatures(fc, {
        dataProjection:    'EPSG:4326',
        featureProjection: 'EPSG:3857',
      });

      var kept = [];
      all.forEach(function (f) {
        var props  = f.getProperties();
        var code   = pick(props, CODE_KEYS);
        var fullNm = pick(props, FULL_KEYS);
        if (!isBusan(code, fullNm)) return;

        var name = pick(props, NAME_KEYS) || lastToken(fullNm);
        var gu   = guFromFullName(fullNm)
                || (code ? guNameByCode[code.slice(0, 5)] : '')
                || (/[구군]$/.test(name) ? name : '');

        f.set('__code', code);
        f.set('__gu',   gu);
        // 구·군 피처는 이름 자체가 구 이름이라 동이 없다.
        f.set('__dong', (name && name !== gu) ? name : '');
        kept.push(f);
      });

      return { features: kept, rawCount: (fc.features || []).length };
    }

    /* --- 레이어 구성 ---------------------------------------------------- */

    function buildGuLayer(features) {
      features.forEach(function (f) {
        var code = f.get('__code');
        var gu   = f.get('__gu');
        if (code && gu) guNameByCode[code.slice(0, 5)] = gu;
      });

      // 스타일을 함수로 두면 미분양 값이 바뀔 때 changed()만 부르면 되고,
      // 레이어를 다시 만들거나 setStyle을 돌 필요가 없다.
      guLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: features }),
        style: function (feature) {
          return guFillStyle(getColor(unsoldData[feature.get('__gu')] || 0));
        },
      });
      olMap.addLayer(guLayer);
      showLegend(true);
      console.log('[vworld] 구·군 색상 레이어 추가 (' + features.length + '개)');
    }

    function buildDongLayer(features) {
      // 구·군 레이어가 먼저 떴으면 코드 역참조로 빈 구 이름을 메운다.
      features.forEach(function (f) {
        if (!f.get('__gu')) {
          var code = f.get('__code');
          if (code) f.set('__gu', guNameByCode[code.slice(0, 5)] || '');
        }
      });

      dongSource = new ol.source.Vector({ features: features });
      dongLayer = new ol.layer.Vector({
        source: dongSource,
        style:  dongHitStyle(),
      });
      olMap.addLayer(dongLayer);
      console.log('[vworld] 읍면동 클릭 레이어 추가 (' + features.length + '개)');
    }

    function guFillStyle(color) {
      return new ol.style.Style({
        fill:   new ol.style.Fill({ color: color + 'bb' }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 1.5 }),
      });
    }

    function dongHitStyle() {
      // 알파 0인 fill은 히트 판정 캔버스에도 안 찍혀 폴리곤 내부 클릭이 안 잡힌다.
      // 눈에 안 보일 정도로만 남겨 둔다.
      return new ol.style.Style({
        fill:   new ol.style.Fill({ color: 'rgba(255,255,255,0.01)' }),
        stroke: new ol.style.Stroke({ color: 'rgba(255,255,255,0.35)', width: 0.6 }),
      });
    }

    /* ==================================================================
       클릭
       ================================================================== */

    function bindClick() {
      olMap.on('click', function (evt) {
        if (resolveByVector(evt)) return;
        resolveByWms(evt);
      });
    }

    function resolveByVector(evt) {
      var hit = null;

      olMap.forEachFeatureAtPixel(evt.pixel, function (feature, layer) {
        if (hit) return;
        // 동 레이어를 우선한다. 구 레이어만 맞았으면 동은 빈 값으로 둔다.
        if (layer === dongLayer || layer === guLayer) hit = feature;
      });

      // 히트 판정 캔버스가 반투명 fill을 놓치는 경우가 있어 지오메트리로 한 번 더 본다.
      if (!hit && dongSource) {
        var at = dongSource.getFeaturesAtCoordinate(evt.coordinate);
        if (at && at.length) hit = at[0];
      }

      if (!hit) return false;
      var gu = hit.get('__gu');
      if (!gu) return false;

      onDongClick(gu, hit.get('__dong') || '');
      return true;
    }

    // 벡터 지오메트리가 없을 때의 폴백. WMS 타일에서는 피처를 못 잡으므로
    // 서버에 좌표를 물어 속성만 받아 온다 (CORS가 막히면 여기서 끝난다).
    function resolveByWms(evt) {
      if (!wmsSource || typeof wmsSource.getFeatureInfoUrl !== 'function') return;

      var view = olMap.getView();
      var url = wmsSource.getFeatureInfoUrl(
        evt.coordinate, view.getResolution(), view.getProjection(),
        { INFO_FORMAT: 'application/json', QUERY_LAYERS: WMS_DONG, FEATURE_COUNT: 5 }
      );
      if (!url) return;

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          var feats = (data && data.features) || [];
          if (!feats.length) return;
          var props  = feats[0].properties || {};
          var code   = pick(props, CODE_KEYS);
          var fullNm = pick(props, FULL_KEYS);
          var name   = pick(props, NAME_KEYS) || lastToken(fullNm);
          var gu     = guFromFullName(fullNm)
                    || (code ? guNameByCode[code.slice(0, 5)] : '')
                    || (/[구군]$/.test(name) ? name : '');
          if (!gu) return;
          onDongClick(gu, (name && name !== gu) ? name : '');
        })
        .catch(function (e) {
          if (!wmsInfoWarned) {
            wmsInfoWarned = true;
            console.warn('GetFeatureInfo 실패 — 지도 클릭이 동작하지 않습니다:', e.message);
          }
        });
    }

    function onDongClick(guName, dongName) {
      // Dash 브리지: 부모의 dcc.Interval(gu-click-interval)이 500ms마다
      // window.__lastGuClick을 폴링해 clicked-gu-store로 옮긴다.
      // 이 페이지는 부모와 같은 origin(/vworld-map.html)에서 서빙되므로
      // 부모 전역에 직접 쓸 수 있다. 다른 origin으로 옮기면 여기서 막힌다.
      //
      // 값은 JSON 문자열이다. 브리지가 "이전 값과 같으면 무시"로 중복 갱신을
      // 걸러내는데, 객체를 그대로 넣으면 매번 다른 참조라 그 비교가 깨진다.
      var payload = JSON.stringify({ gu: guName, dong: dongName });
      try {
        window.parent.__lastGuClick = payload;
      } catch (e) {
        console.warn('부모 window에 쓸 수 없습니다 (cross-origin?):', e);
      }

      // 향후 message 방식 리스너를 위해 postMessage도 함께 보낸다.
      window.parent.postMessage({ type: 'dong_click', gu: guName, dong: dongName }, '*');
    }

    /* ==================================================================
       미분양 색상 주입
       ================================================================== */

    window.addEventListener('message', function (evt) {
      if (evt.data && evt.data.type === 'unsold_data') {
        unsoldData = evt.data.data || {};
        refreshColors();
      }
    });

    function refreshColors() {
      // 레이어가 아직 없으면 unsoldData만 갱신해 둔다.
      // buildGuLayer의 스타일 함수가 나중에 이 값을 읽는다.
      if (!guLayer) return;
      guLayer.changed();
      showLegend(true);
    }

    /* ------------------------------------------------------------------
       기동

       로더 자체는 <head>의 인라인 document.write가 파싱 시점에 심어 놓았다.
       그쪽은 파서가 동기·순서 보장으로 처리하므로 여기서는 로드 완료만 기다린다.
       ------------------------------------------------------------------ */

    var POLL_INTERVAL_MS  = 300;
    var POLL_MAX_ATTEMPTS = 50;          // 50 × 300ms = 최대 15초
    var INIT_DELAY_MS     = 500;         // 로더 체인이 전역 등록을 끝낼 여유

    // 생성자가 실제로 건드리는 심볼만 확인한다.
    // (ol은 여기서 검사하지 않는다 — 로더가 어떤 이름으로 노출하든
    //  vw.ol3.Map이 준비됐다면 그 내부 의존성도 함께 올라와 있다.)
    function missingDeps() {
      var missing = [];
      if (typeof vw === 'undefined' || !vw.ol3) {
        missing.push('vw.ol3');
      } else {
        if (!vw.ol3.Map) missing.push('vw.ol3.Map');
        if (!vw.ol3.BasemapType || typeof vw.ol3.BasemapType.GRAPHIC === 'undefined') {
          missing.push('vw.ol3.BasemapType');
        }
      }
      return missing;
    }

    function waitForVWorld(attempt) {
      attempt = attempt || 0;
      setTimeout(function () {
        var missing = missingDeps();
        if (!missing.length) {
          initMap();
        } else if (attempt < POLL_MAX_ATTEMPTS) {
          waitForVWorld(attempt + 1);
        } else {
          console.error('V-World 의존성 대기 시간 초과. 누락:', missing);
          setLoading('V-World API 로드 실패 — 누락: ' + missing.join(', ')
                     + ' (도메인 ' + currentDomain() + ')');
        }
      }, POLL_INTERVAL_MS);
    }

    // window load = 로더와 그 체인의 서브리소스까지 전부 끝난 시점.
    // 거기서 한 번 더 500ms 여유를 두고 폴링을 시작한다.
    window.addEventListener('load', function () {
      setTimeout(function () { waitForVWorld(0); }, INIT_DELAY_MS);
    });
  </script>
</body>
</html>
